services:
  - type: web
    name: contex-app
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: TESSDATA_PREFIX
        value: /usr/share/tesseract-ocr/5/tessdata
    disk:
      name: uploads
      mountPath: /opt/render/project/src/uploads
      sizeGB: 1
