name = "contex"
main = "worker/index.js"
compatibility_date = "2026-01-15"

# Two addresses, one Worker. contex.rhengtl.tech is the published one;
# contex.rhengtl.workers.dev stays up as the fallback.
#
# workers_dev is set explicitly because it is NOT the default once a route
# exists: Wrangler's documented default is true only "when the configuration
# has no route or routes, and false otherwise". Left implicit, adding the
# custom domain below would have taken workers.dev down on the next deploy.
workers_dev = true

# A Custom Domain, not a zone route: Cloudflare creates the DNS record and the
# certificate itself, and the Worker is the origin -- there is no server behind
# it. It needs rhengtl.tech to be an active zone on this account (nameservers
# moved to Cloudflare), and contex.rhengtl.tech must not already have a CNAME.
# tools/site.mjs reads this entry: the canonical link and the absolute
# share-card URLs in every page are built from it, so this is the one place the
# primary address is written.
[[routes]]
pattern = "contex.rhengtl.tech"
custom_domain = true

# Where the Worker runs. By default Cloudflare runs it in whichever data
# centre answered the visitor -- and the Gemini API refuses a request by where
# it COMES FROM. Visitors in the Philippines are served from Manila or Hong
# Kong; Hong Kong is not a supported Gemini region, and on 2026-10-12 every
# upload from there was refused:
#
#     page upload refused (400): "User location is not supported for the API
#     use." FAILED_PRECONDITION
#
# which took the AI path down for those users entirely. A placement hint runs
# the Worker beside a Google Cloud region instead, so its requests to Google
# always leave from a supported country, wherever the visitor is.
#
# us-central1 rather than a nearer Asian region: Cloudflare's egress in Asia
# is what was misplaced, so the hint has to land somewhere whose egress is
# unambiguous. The Gemini API and the Firestore database are both served from
# there, so the Worker's own subrequests get shorter too. The visitor pays one
# extra round trip to reach it (~150-200 ms from Manila) on API calls only:
# static assets -- the pages, the TeX tree, the models -- are still served from
# the nearest data centre, because run_worker_first is false.
[placement]
region = "gcp:us-central1"

# Static assets are served by the platform, not by the Worker. This is what
# keeps the TeX Live tree and the model weights off the 100,000 requests/day
# meter -- requests that do not invoke the Worker are free and unlimited.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = false

# The addresses Flask served. url_for('auth.login') was "/login", so /login is
# what has to work -- the default (auto-trailing-slash) answers it with a 307
# to "/login/", which is a redirect on every visit and a different URL in the
# address bar. This serves login/index.html at /login and redirects the other
# way instead.
html_handling = "drop-trailing-slash"

# public/404.html for anything the tree does not carry, which is what
# web/errors.py's not_found() did. Without this a wrong address gets a bare
# platform 404 with no way back to the workspace.
not_found_handling = "404-page"

# Workers Logs. Every console.error the Worker writes -- "retired or renamed?",
# "page upload refused", "Firestore access token refused" -- is what says why
# conversions stopped, and without this it is visible only to someone running
# `wrangler tail` at that moment. Declared here rather than toggled in the
# dashboard because a deploy overwrites the dashboard's answer with this
# file's: a switch flipped there would be flipped back by the next publish.
# invocation_logs adds one line per request (path, status, duration), which is
# how a run of 429s or 503s shows up. Sampling at 1 keeps everything; at this
# traffic that stays well inside the free plan's daily allowance.
[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1

# Global per-caller rate limiting, replacing the per-process deque in
# contex/web/security.py. SQLite backend: the only kind available on the
# Workers Free plan.
[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

# Per-model outage records (availability.py, file -> KV). Rare writes: the
# 1,000/day free write cap is not a constraint here.
[[kv_namespaces]]
binding = "OUTAGES"
id = "74ad8470027e4a96a2fcd2acaf115327"

# The three settings config.py browser_firebase() hands to the page. Public by
# design: they identify the project, they are not credentials, and the security
# rules are what protect the data. FIREBASE_API_KEY is also what the Worker
# uses to call the Identity Toolkit, which is the same key Flask used for the
# same calls -- a Web API key is not a secret and Google documents it as such.
[vars]
FIREBASE_AUTH_DOMAIN = "contex-28bfd.firebaseapp.com"
FIREBASE_PROJECT_ID = "contex-28bfd"
FIREBASE_API_KEY = "AIzaSyDwR_fRTrqvSOt_CrJoVHOIpc2lLCF8dtc"

# session.py reads this from configuration, so this does too. Bump it to make
# every user accept the terms again.
#   2.1-2026-09-12  history retention became "the 20 most recent"; the UI
#                   typefaces moved in-house, so a page load no longer
#                   contacts Google Fonts. Both are statements in the policy.
TERMS_VERSION = "2.1-2026-09-12"

# Secrets, set with `wrangler secret put` and never committed:
#   GEMINI_API_KEY            the conversion key
#   SESSION_HMAC_KEY          signs the session cookie
#   FIREBASE_SERVICE_ACCOUNT  the service account JSON, verbatim. This is the
#                             edge equivalent of services/firebase.py's key
#                             file: the Worker reaches Firestore with it and,
#                             like the Admin SDK, bypasses the security rules --
#                             so every read is scoped by uid in history.js
#                             instead, exactly as data/history.py does.
#                             2,376 B, within the 5 KB per-secret cap.
