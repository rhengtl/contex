<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ConTeX</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<main>
  <h1>ConTeX</h1>
  <p class="tagline">Turn any page &mdash; handwritten, printed, photographed or
  typed &mdash; into LaTeX.</p>

  <section id="terms" hidden>
    <label><input type="checkbox" id="accept">
      I accept the Terms of Service and Privacy Policy.</label>
  </section>

  <section id="convert">
    <input type="file" id="file"
           accept=".png,.jpg,.jpeg,.bmp,.tiff,.tif,.webp,.gif,.pdf,.docx">
    <button id="go" type="button">Convert</button>
    <p id="status" role="status" aria-live="polite"></p>
    <p id="error" role="alert" hidden></p>
  </section>

  <section id="result" hidden>
    <div class="actions">
      <button id="download" type="button">Download .tex</button>
      <button id="download-pdf" type="button" hidden>Download PDF</button>
      <button id="copy" type="button">Copy</button>
    </div>
    <p id="preview-error" class="notice" hidden></p>
    <div id="preview" aria-label="PDF preview"></div>
    <details id="source"><summary>LaTeX source</summary><pre id="tex"></pre></details>
  </section>
</main>
<script type="module" src="/app.js"></script>
</body>
</html>
