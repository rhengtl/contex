# The edge application: verify on every pull request, publish from master.
#
# WHY THE GUARD JOB EXISTS, AND WHY IT IS NOT PARANOIA. What Cloudflare serves
# is edge/public, and 137 MB of that tree is gitignored build output. Most of it
# a runner could rebuild -- vendor/ort and vendor/tesseract come from npm, and
# models/mfr from the committed edge/model-src/mfr-int8 -- but public/texmf cannot
# be rebuilt from anything in this repository. build:texmf works IN PLACE,
# adding the extensionless .tfm copies kpathsea needs to a directory that must
# already have been harvested from a TeX Live installation, and the 10.36 MB
# SwiftLaTeX format file inside it has no source here at all.
#
# So a clean checkout cannot run the suite -- check:assets fails at once -- and,
# far worse, `wrangler deploy` from a clean checkout would happily publish the
# files that ARE committed and take the live site's fonts and engine data away
# with it.
#
# So both jobs refuse to run rather than run on half a tree. Until the asset
# question is settled (commit them, Git LFS, or a release artifact restored
# here) this workflow reports what is missing and stops. That is a louder and
# more honest failure than a green tick over an unverified build, and much
# safer than a deploy that silently breaks production.

name: edge

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: runtime assets present
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - uses: actions/checkout@v5

      - id: check
        run: |
          missing=""
          for tree in edge/public/texmf edge/public/models \
                      edge/public/vendor/ort edge/public/vendor/tesseract; do
            if [ ! -d "$tree" ] || [ -z "$(ls -A "$tree" 2>/dev/null)" ]; then
              missing="$missing $tree"
            fi
          done

          if [ -n "$missing" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The runtime asset trees are not in this repository, so"
            echo "::notice::the suite and the deploy are both skipped. Missing:$missing"
            echo "See the comment at the top of .github/workflows/edge.yml."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: guard
    if: needs.guard.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: edge
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: edge/package-lock.json

      - run: npm ci

      # The browser suites drive Microsoft Edge specifically, because that is
      # the channel tests/*.mjs launch.
      - run: npx playwright-core install msedge --with-deps

      - run: npm test

  deploy:
    needs: [guard, test]
    if: github.ref == 'refs/heads/master' && needs.guard.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    defaults:
      run:
        working-directory: edge
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: edge/package-lock.json

      - run: npm ci

      # Secrets are NOT set from here. GEMINI_API_KEY, SESSION_HMAC_KEY and
      # FIREBASE_SERVICE_ACCOUNT live in the Worker and survive a deploy; a
      # workflow that could rewrite them would put three production
      # credentials inside GitHub's secret store for no benefit.
      - name: Publish the Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Check the deployment answers
        run: |
          for attempt in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
                   https://contex.rhengtl.workers.dev/api/session || true)
            if [ "$code" = "200" ]; then
              echo "Live: /api/session answered 200 after $((attempt * 5))s."
              exit 0
            fi
            echo "  attempt $attempt: $code"
            sleep 5
          done
          echo "::error::The Worker published but /api/session never answered 200."
          exit 1
