# Production release: master -> GHCR -> the server pulls -> verify it landed.
#
# HOW A RELEASE ACTUALLY REACHES THE SITE, because this workflow does not put
# it there:
#
#   1. test + rules    nothing is published unless both pass
#   2. publish         builds the arm64 image and pushes it to GHCR
#   3. the server      a systemd timer on the VM pulls every two minutes
#                      (deploy/contex-update.timer) and restarts if the digest
#                      moved
#   4. verify          polls the live site until /healthz reports this commit
#
# WHY PULL RATHER THAN PUSH. The alternative is a workflow that SSHes into the
# machine, which needs a private key in GitHub's secret store and port 22 open
# to GitHub's address ranges. That makes a compromise of CI a compromise of the
# server. Polling needs no inbound access and no key, and costs about two
# minutes of delay on a build that already takes far longer than that.
#
# WHY THE VERIFY JOB EXISTS. Because of the above, a green build proves only
# that an image was published. Step 4 is the part that proves the thing people
# actually visit changed - the Dockerfile stamps the commit into the image and
# /healthz reports it back.

name: deploy

on:
  push:
    branches: [master]
    # Files that cannot reach the running application: .dockerignore keeps
    # every one of them out of the image, so a change here would build a
    # byte-identical container.
    #
    # Nothing that ships is listed. templates/, static/, contex/,
    # requirements.txt and the Dockerfile all trigger a release.
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - 'bench/**'
      - 'brand/**'
  workflow_dispatch:

permissions:
  contents: read
  # Publishing to ghcr.io under this repository. The token is minted for this
  # run and expires with it, so there is no registry password anywhere.
  packages: write

concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  # The same suite that gates pull requests, called rather than copied so the
  # two cannot drift.
  test:
    uses: ./.github/workflows/tests.yml

  rules:
    name: firestore-rules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # The Firestore emulator is a Java program.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci

      # Against the real rules evaluator on a throwaway local project, so it
      # needs no credentials and touches nothing in contex-28bfd. It gates the
      # release because these rules are what stop one account reading another's
      # history - even though they are applied by hand rather than from here.
      - run: npm run test:rules

  publish:
    needs: [test, rules]
    # A native arm64 runner, free and unlimited on public repositories. The
    # alternative is cross-building under QEMU, which for an image carrying a
    # TeX distribution, torch and an ONNX model means hours rather than minutes.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercased because a registry reference must be, and a GitHub owner
      # need not be - `RhenGTL/contex` is a valid repository and an invalid
      # image name.
      - name: Work out the image name
        id: meta
        run: echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and publish the image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          # Two tags on purpose. :latest is what the server follows; the commit
          # tag is what makes a rollback possible - pin the compose file to an
          # older one and restart.
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          # Layer cache in the registry, so an ordinary change to contex/ or
          # templates/ does not reinstall TeX Live or re-download the model.
          cache-from: type=registry,ref=${{ steps.meta.outputs.image }}:buildcache
          cache-to: type=registry,ref=${{ steps.meta.outputs.image }}:buildcache,mode=max

  verify:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Skipped rather than failed when the URL is not configured, so the
      # publish half of this pipeline is usable before the server exists.
      - name: Wait for the live site to report this commit
        env:
          SITE: ${{ vars.CONTEX_PUBLIC_URL }}
        run: |
          if [ -z "$SITE" ]; then
            echo "::notice::CONTEX_PUBLIC_URL is not set, so there is nothing to verify against."
            echo "Set it under Settings -> Secrets and variables -> Actions -> Variables"
            echo "once the server is up, e.g. https://contex.duckdns.org"
            exit 0
          fi

          echo "Waiting for $SITE to come back as ${GITHUB_SHA}"
          # The server checks for a new image every two minutes and then has to
          # pull several gigabytes and reload the model, so allow ten.
          for attempt in $(seq 1 60); do
            live=$(curl -fsS --max-time 10 "$SITE/healthz" 2>/dev/null \
                   | python3 -c 'import json,sys; print(json.load(sys.stdin).get("revision",""))' 2>/dev/null || true)
            if [ "$live" = "$GITHUB_SHA" ]; then
              echo "Live after $((attempt * 10))s."
              exit 0
            fi
            echo "  attempt $attempt: serving '${live:-unreachable}'"
            sleep 10
          done

          echo "::error::The site never reported ${GITHUB_SHA}. The image published"
          echo "successfully, so look at the server: systemctl status contex-update.timer"
          echo "and docker compose logs on the VM."
          exit 1

      - name: Summarise the release
        if: always()
        run: |
          {
            echo "## Release ${{ job.status }}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`${GITHUB_SHA::7}\` |"
            echo "| Image | \`${{ needs.publish.outputs.image }}:${GITHUB_SHA::7}\` |"
            echo "| Live site | ${{ vars.CONTEX_PUBLIC_URL || '_not configured_' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
