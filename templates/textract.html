<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Textract</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem; background: #f9f9f9; }
        .container { max-width: 600px; margin: auto; background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { text-align: center; }
        form { margin-bottom: 1.5rem; }
        input[type="file"] { display: block; margin: 1rem 0; }
        button { background-color: #007bff; color: white; border: none; padding: 0.7rem 1.2rem; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        .result { background: #eef; padding: 1rem; border-radius: 5px; white-space: pre-wrap; font-family: monospace; }
        .error { background: #fdd; padding: 1rem; border-radius: 5px; color: #900; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Textract</h1>

        <form method="POST" enctype="multipart/form-data">
            <label for="file">Choose an image or PDF file:</label>
            <input type="file" id="file" name="file" accept=".png,.jpg,.jpeg,.bmp,.tiff,.pdf" required />
            <button type="submit">Upload & Process</button>
        </form>

        {% if recognized_text %}
            <h2>Recognized Text:</h2>
            <div class="result">{{ recognized_text }}</div>
        {% endif %}

        {% if tex_file %}
            <h3>Download LaTeX File:</h3>
            <a href="{{ url_for('download_tex') }}">
            <button type="button">Download .tex</button>
        </a>
        {% endif %}


        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
    </div>
</body>
</html>
