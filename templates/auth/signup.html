<!-- templates/signup.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Sign Up - ConTeX App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        poppins: ['Poppins', 'sans-serif'],
                    },
                    colors: {
                        forest: {
                            900: '#1F2937',
                            800: '#2B4C3F',
                            700: '#3A5F4D',
                            600: '#4B7161',
                            500: '#698575',
                            400: '#86998A',
                        },
                        burgundy: {
                            600: '#8B3A4A',
                            500: '#A54B5E',
                            400: '#BF5C72',
                        },
                        cream: {
                            100: '#F7F4F1',
                            200: '#EAE6E1',
                            300: '#DDD8D3',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-forest-100/50 min-h-screen font-poppins">
    <main class="flex flex-col items-center justify-center min-h-screen py-8">
        <div class="bg-cream-100 rounded-lg outline outline-1 outline-gray-300 shadow-lg max-w-md w-[95%] md:w-full p-6 md:p-8">
            <h2 class="text-3xl font-bold text-forest-800 mb-2 text-center">Create Account</h2>
            <p class="text-forest-600 mb-6 text-center">Sign up to get started</p>

            {% if error %}
                <div class="mb-4 bg-red-100 text-red-700 p-3 rounded">
                    {{ error }}
                </div>
            {% endif %}

            {% if success %}
                <div class="mb-4 bg-green-100 text-green-700 p-3 rounded">
                    {{ success }}
                </div>
            {% endif %}

            <form method="POST" action="{{ url_for('signup') }}" class="space-y-4">
                <div>
                    <label for="fullname" class="block text-forest-700 font-medium mb-2">Full Name</label>
                    <input 
                        type="text" 
                        id="fullname" 
                        name="fullname" 
                        required 
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-forest-600"
                        placeholder="John Doe"
                    >
                </div>

                <div>
                    <label for="email" class="block text-forest-700 font-medium mb-2">Email</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        required 
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-forest-600"
                        placeholder="your.email@example.com"
                    >
                </div>

                <div>
                    <label for="password" class="block text-forest-700 font-medium mb-2">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        required 
                        minlength="8"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-forest-600"
                        placeholder="At least 8 characters"
                    >
                </div>

                <div>
                    <label for="confirm-password" class="block text-forest-700 font-medium mb-2">Confirm Password</label>
                    <input 
                        type="password" 
                        id="confirm-password" 
                        name="confirm_password" 
                        required 
                        minlength="8"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-forest-600"
                        placeholder="Re-enter your password"
                    >
                </div>

                <div class="flex items-start">
                    <input 
                        type="checkbox" 
                        id="terms" 
                        name="terms" 
                        required 
                        class="mt-1 mr-2"
                    >
                    <label for="terms" class="text-sm text-forest-600">
                        I agree to the <a href="#" class="text-burgundy-600 hover:text-burgundy-500">Terms of Service</a> and <a href="#" class="text-burgundy-600 hover:text-burgundy-500">Privacy Policy</a>
                    </label>
                </div>

                <button 
                    type="submit" 
                    class="w-full bg-forest-800 text-cream-100 py-3 rounded-lg hover:bg-forest-700 transition-colors font-medium"
                >
                    Sign Up
                </button>
            </form>

            <div class="mt-6 text-center">
                <p class="text-forest-600">
                    Already have an account? 
                    <a href="{{ url_for('login') }}" class="text-burgundy-600 hover:text-burgundy-500 font-medium">Login</a>
                </p>
            </div>

            <div class="mt-6">
                <div class="relative">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-gray-300"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-2 bg-cream-100 text-forest-600">Or sign up with</span>
                    </div>
                </div>

                <div class="mt-4 grid grid-cols-2 gap-3">
                    <button class="flex items-center justify-center px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors">
                        <svg class="w-5 h-5 mr-2" viewBox="0 0 24 24">
                            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                        </svg>
                        <span class="text-sm text-forest-700">Google</span>
                    </button>
                    <button class="flex items-center justify-center px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors">
                        <svg class="w-5 h-5 mr-2" fill="#1877F2" viewBox="0 0 24 24">
                            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                        </svg>
                        <span class="text-sm text-forest-700">Facebook</span>
                    </button>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
