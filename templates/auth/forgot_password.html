<!-- templates/forgot_password.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password - ConTeX App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="bg-forest-100/50 min-h-screen font-poppins">
    <main class="flex flex-col items-center justify-center min-h-screen pt-[10vh]">
        <div class="bg-cream-100 rounded-lg outline outline-1 outline-gray-300 shadow-lg max-w-md w-[95%] md:w-full p-6 md:p-8">
            <h2 class="text-3xl font-bold text-forest-800 mb-2 text-center">Forgot Password?</h2>
            <p class="text-forest-600 mb-6 text-center">Enter your email and we'll send you a link to reset your password</p>

            {% if error %}
                <div class="mb-4 bg-red-100 text-red-700 p-3 rounded">
                    {{ error }}
                </div>
            {% endif %}

            {% if success %}
                <div class="mb-4 bg-green-100 text-green-700 p-3 rounded">
                    {{ success }}
                </div>
            {% endif %}

            <form method="POST" action="{{ url_for('forgot_password') }}" class="space-y-4">
                <div>
                    <label for="email" class="block text-forest-700 font-medium mb-2">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        required 
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-forest-600"
                        placeholder="your.email@example.com"
                    >
                </div>

                <button 
                    type="submit" 
                    class="w-full bg-forest-800 text-cream-100 py-3 rounded-lg hover:bg-forest-700 transition-colors font-medium"
                >
                    Send Reset Link
                </button>
            </form>

            <div class="mt-6 text-center">
                <p class="text-forest-600">
                    Remember your password? 
                    <a href="{{ url_for('login') }}" class="text-burgundy-600 hover:text-burgundy-500 font-medium">Back to Login</a>
                </p>
            </div>

            <div class="mt-4 text-center">
                <p class="text-sm text-forest-600">
                    Don't have an account? 
                    <a href="{{ url_for('signup') }}" class="text-burgundy-600 hover:text-burgundy-500 font-medium">Sign up</a>
                </p>
            </div>
        </div>
    </main>
</body>
</html>
